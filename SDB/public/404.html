<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>System Design Interview – An insider's guide</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or refresh of
      a deep link (e.g. /SDB/chapter/topic) 404s. GitHub serves this file for
      any unmatched path; it re-encodes that path into the query string and
      redirects to the SPA's index, which restores it via history.replaceState
      before React Router ever sees the URL. Standard trick, see
      https://github.com/rafgraph/spa-github-pages.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
